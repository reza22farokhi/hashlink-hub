name: Deploy HashLink Airdrop API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/airdrop-api/**"
      - ".github/workflows/deploy-airdrop-api.yml"

permissions:
  contents: read

concurrency:
  group: hashlink-airdrop-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: workers/airdrop-api
        run: npm ci --no-audit --no-fund

      - name: Run API tests
        working-directory: workers/airdrop-api
        run: npm test

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/airdrop-api
          command: deploy
